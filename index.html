<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coco &amp; Cici Process Atlas</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#6F353F; --plum-dk:#4E2129; --plum-ink:#3B1B21;
  --sky:#C6D6F0; --sky-bg:#EEF3FB;
  --bg:#FBF9F7; --card:#FFFFFF; --ink:#2A2325; --ink-2:#4F4649; --muted:#6B6265;
  --line:#E6E1DD; --line-2:#EFEBE8; --off:#F2EFEC; --off-ink:#958C8F;
  --serif:'Lora',Georgia,serif; --sans:'Work Sans',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--plum)} a:hover{color:var(--plum-dk)}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.2}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* header */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;min-height:44px}
.brand img{height:24px;width:auto;display:block}
.brand .sep{width:1px;height:24px;background:var(--line)}
.brand .name{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--plum)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;border-radius:6px;padding:0 14px;min-height:40px;font-size:14px;font-weight:500;background:transparent;color:var(--plum);text-decoration:none;display:inline-flex;align-items:center}
.tab.on{background:var(--plum);color:#fff}
.search{flex:1 1 200px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:40px;background:var(--bg);position:relative}
.search input{border:0;background:transparent;flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);outline:none}
.results{position:absolute;left:0;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(42,35,37,.12);padding:6px;display:none;max-height:360px;overflow:auto}
.results.show{display:block}
.results a{display:block;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px}
.results a:hover,.results a:focus{background:var(--sky-bg)}
.results .none{padding:8px 10px;color:var(--muted);font-size:14px}
.ver{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

/* layout */
.wrap{max-width:1320px;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.side{flex:1 1 250px;max-width:300px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 8px}
.ti{display:block;border-radius:6px;padding:6px 10px;font-size:14px;min-height:34px;text-decoration:none}
a.ti{color:var(--plum);font-weight:500}
a.ti.on{background:var(--sky-bg);font-weight:600}
span.ti{color:var(--off-ink)}
.side hr{border:0;border-top:1px solid var(--line-2);margin:10px 0 6px;width:100%}
.legend{display:flex;flex-direction:column;gap:6px;padding:14px 10px 4px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:22px}

/* type */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.crumbs a{text-underline-offset:3px}
.crumbs .sl{color:var(--off-ink)}
.crumbs .cur{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--plum)}
.head{display:flex;flex-direction:column;gap:8px;max-width:800px}
.head h1{font-size:32px}
.lead{margin:0;color:var(--ink-2);font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.meta b{font-weight:600}
.note{font-size:13px;color:var(--muted);margin:0}

/* cards */
.grid{display:grid;gap:14px}
.g-l1{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g-l2{grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}
.card{border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;text-decoration:none}
.card .top-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em}
.card .t{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.25}
.card .d{font-size:14px;flex:1}
.card .f{font-size:13px;padding-top:10px;display:flex;justify-content:space-between;gap:8px}
.pill{border-radius:999px;padding:2px 10px;font-size:12px;letter-spacing:0;font-weight:500;align-self:flex-start}
.card.live{background:var(--plum);color:#fff;box-shadow:0 6px 18px rgba(111,53,63,.22);transition:transform .15s,box-shadow .15s}
.card.live:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(111,53,63,.28);color:#fff}
.card.live .d{color:#F3E6E8}
.card.live .f{border-top:1px solid rgba(255,255,255,.3)}
.card.live .pill{background:var(--sky);color:var(--plum-ink)}
.card.off{background:var(--off);color:var(--off-ink);border:1px solid var(--line)}
.card.off .f{border-top:1px solid var(--line)}
.card.off .pill{border:1px solid #DAD3CF}
.min-l1{min-height:200px}.min-l2{min-height:215px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:20px}
.panel.sky{background:var(--sky-bg);border-color:var(--sky)}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.ph span{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.fact .k{font-size:12px;color:var(--muted)}
.fact .v{font-weight:500}
.keys{display:grid;grid-template-columns:52px 1fr;gap:8px 12px;font-size:14px;align-items:baseline}
.keys b{color:var(--plum);font-weight:600}
ol.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* tables */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.tbl .in{min-width:700px}
.row{display:grid;gap:12px;align-items:center;padding:13px 18px;font-size:14px;text-decoration:none}
.row.h{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 18px}
.c-l3{grid-template-columns:70px minmax(0,1fr) 110px 110px 170px}
a.row.live{background:var(--plum);color:#fff}
a.row.live:hover{background:var(--plum-dk);color:#fff}
.row.off{background:#F7F5F3;color:var(--off-ink);border-bottom:1px solid var(--line-2)}
.row .nm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:11px;border-radius:999px;padding:1px 8px}
a.row.live .tag{background:var(--sky);color:var(--plum-ink)}
.row.off .tag{border:1px solid #DAD3CF}
.grp-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;background:#F7F5F3;border-bottom:1px solid var(--line)}
.grp-h h3{font-size:17px}
.btn{display:inline-flex;align-items:center;border-radius:999px;padding:0 14px;min-height:32px;font-size:13px;font-weight:500;text-decoration:none}
.btn.live{background:var(--plum);color:#fff}
.btn.live:hover{background:var(--plum-dk);color:#fff}
.btn.off{color:var(--off-ink);border:1px solid #DAD3CF}
.c-raci{grid-template-columns:minmax(0,1fr) 90px 100px 130px 180px;padding:9px 18px;border-top:1px solid var(--line-2)}
.chip{border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600;display:inline-block}
.ch-cath{background:var(--plum);color:#fff}
.ch-kiki{background:var(--sky);color:var(--plum-ink)}
.ch-coord{background:#fff;color:var(--plum);border:1px solid var(--plum)}
.ch-none{color:var(--off-ink);border:1px solid var(--line)}
.c-mx{grid-template-columns:minmax(0,1fr) repeat(5,92px);padding:8px 0;gap:8px;border-bottom:1px solid var(--off)}
.c-mx.h{border-bottom:1px solid var(--line);text-transform:none;letter-spacing:0;padding:8px 0}
.c-mx .ctr{text-align:center;justify-self:center}
.lt{min-width:28px;text-align:center;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600}
.lt-R{background:var(--plum);color:#fff}.lt-A{background:var(--sky);color:var(--plum-ink)}
.lt-C{background:#fff;color:var(--plum);border:1px solid var(--plum)}.lt-I{background:var(--off);color:var(--ink-2)}.lt-{color:#C9C1C3}

/* flow */
.flow-box{overflow-x:auto}
.flow{min-width:940px;display:grid;grid-template-columns:130px repeat(7,minmax(0,1fr));grid-template-rows:108px 124px 108px;column-gap:10px}
.lane{background:#F7F5F3;display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line)}
.rule{border-bottom:1px solid var(--line);display:flex;align-items:center}
.rule i{display:block;height:2px;width:100%;background:#D8CFCB}
.node{align-self:center;z-index:1;border-radius:10px;padding:10px 12px;min-height:80px;font-size:13px;text-decoration:none;display:block}
a.node{background:var(--plum);color:#fff;box-shadow:0 4px 12px rgba(111,53,63,.2)}
a.node:hover{background:var(--plum-dk);color:#fff}
.node.ext{background:var(--off);color:var(--off-ink);border:1px dashed #D8CFCB}
.ev{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:1}
.ev .s{width:30px;height:30px;border:2px solid var(--off-ink);border-radius:50%;background:#fff}
.ev .e{width:30px;height:30px;border:4px solid var(--off-ink);border-radius:50%;background:#fff}
.ev .g{width:30px;height:30px;border:2px solid var(--off-ink);background:#fff;transform:rotate(45deg)}
.ev span:last-child{font-size:12px;color:var(--off-ink);background:#fff;padding:0 4px;text-align:center}

/* steps */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.sp{border-radius:999px;padding:0 14px;min-height:36px;font-size:13px;display:inline-flex;align-items:center;text-decoration:none;background:#fff;color:var(--plum);border:1px solid var(--line)}
.sp.on{background:var(--plum);color:#fff;border-color:var(--plum)}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
ol.steps li{display:flex;gap:14px;align-items:flex-start;counter-increment:s}
ol.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--sky-bg);border:1px solid var(--sky);color:var(--plum);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
ol.steps li span{padding-top:2px}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bx{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.bx .k{font-size:12px;font-weight:600;color:var(--plum);text-transform:uppercase;letter-spacing:.06em}
.bx.done{border-color:var(--plum)} .bx.why{background:var(--sky-bg);border-color:var(--sky)}
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.nb{display:inline-flex;align-items:center;border-radius:8px;padding:0 16px;min-height:44px;font-weight:500;text-decoration:none;border:1px solid var(--plum);color:var(--plum);background:#fff}
.nb.pri{background:var(--plum);color:#fff}
.nb.dis{border-color:var(--line);color:var(--off-ink);pointer-events:none}
.gov{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:13px;color:var(--ink-2)}
.gov b{font-weight:600}
.gov a{margin-left:auto}
.foot{margin:8px 0 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:700px){.wrap{padding:16px}.head h1{font-size:26px}.side{max-width:none}.top-in{padding:10px 16px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="Coco &amp; Cici Process Atlas, home">
      <img src="assets/logo.svg" alt="Coco &amp; Cici">
      <span class="sep" aria-hidden="true"></span>
      <span class="name">Process Atlas</span>
    </a>
    <nav class="tabs" aria-label="Sections">

    <div class="search" role="search">

</header>
<div class="wrap">

  {code:'3.1.5', name:'Sign the contract', r:'Cath', a:'Cath', when:'Before production', tag:'Gate 1'},

   done:'The message is sent and the tracker shows the status and chase date.', rules:'No signed contract, no step. A PO only binds once the supplier has accepted it in writing.', why:'A written confirmation per line is the last moment a missing size is cheap to fix.', mistake:'Accepting "OK, confirmed" in a chat without the list of lines.', raci:['R','A','I','','']},

   done:'The confirmation is in, or Cath has the escalation.', rules:'Chase after 3 working days. Escalate after two unanswered reminders. Follow up before a date is missed, not after.', why:'Every silent day here is a day lost on a three-month sea lead time.', mistake:'Starting a new thread, so the history is lost.', raci:['R','A','C','','']},

  {code:'3.1.6.4', short:'Fix mismatch', title:'Fix the mismatch', who:'Production coordinator; Cath decides when the supplier cannot fix it', when:'Any line flagged in step 3', time:'About 15 minutes plus waiting', tools:'Tracker exceptions tab · supplier thread',
   steps:['Log the difference in the exceptions tab: which line, what is wrong, what it affects.','Ask the supplier to correct and re-confirm within two working days.','Supplier cannot fix it: send Cath three options: accept, swap colour or size, or re-order.','Log Cath’s decision with the date and the reason.','Check the corrected lines again (step 3).'],
   done:'Every flag is closed with a logged decision.', rules:'Only Cath approves a change to colour, size or quantity. The supplier re-confirms within 2 working days.', why:'Each logged exception is checked against the step it broke. That is how this instruction stays current.', mistake:'Agreeing a fix by phone without logging it.', raci:['R','A','C','I','']},
  {code:'3.1.6.5', short:'Hand over', title:'Record the dates and hand over', who:'Production coordinator', when:'All lines match', time:'About 10 minutes', tools:'Order tracker · team chat',

   done:'The status is Confirmed and Isabel and Kiki have the dates.', rules:'After confirmation, any change to labels, packaging or sizes is a change request to Cath, logged with its cost and delay.', why:'The S&OP plans stock and pre-order dates on these confirmed dates, not on the PO.', mistake:'Updating the tracker but not telling Isabel.', raci:['R','I','','I','I']}
];
var RACI = [
  {phase:'Development', where:'1 Insight to launch', rows:[
    ['Design new collections','F','F','Per collection'],['Develop fabrics (100% modal, silk and TENCEL, bedding blends)','F','F','Ongoing'],['Make samples and choose the fabric','F','F','Per product'],['Set sizes (fittings)','F','F','Per collection'],['Choose colours, approve lab dips','F','F','2 to 3 weeks per round'],['Prepare colours: all of next year ready in Q4','F','F','Yearly, Q4'],['Test fabric on the roll (SGS, Lenzing)','K','F','With new fabric'],['Final sample rounds, approve the model','F','F','Per product']]},
  {phase:'Order', where:'3.1 Order', href:'#/order', rows:[

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var WHO = {F:['Cath','ch-cath'], K:['Kiki','ch-kiki'], C:['Coordinator','ch-coord'], '-':['None','ch-none']};
function chip(k){var w=WHO[k]||WHO['-'];return '<span class="chip '+w[1]+'">'+w[0]+'</span>';}
function nextR(k){return k==='K'||k==='C' ? chip('C') : chip(k==='-'?'-':k);}

V.step = function(i){
  var a = ACTS[i];
  var pills = ACTS.map(function(x,j){return '<a class="sp'+(j===i?' on':'')+'" href="#/step/'+(j+1)+'"'+(j===i?' aria-current="page"':'')+'>'+(j+1)+'. '+esc(x.short)+'</a>';}).join('');
  var prev = i>0 ? '<a class="nb" href="#/step/'+i+'">← Previous step</a>' : '<span class="nb dis">← Previous step</span>';
  var next = i<ACTS.length-1 ? '<a class="nb pri" href="#/step/'+(i+2)+'">Next step →</a>' : '<a class="nb pri" href="#/confirm-po">Back to the process →</a>';

  '<div class="head"><span class="eyebrow">Level 4 · '+a.code+' · Work instruction</span><h1 style="font-size:30px">'+esc(a.title)+'</h1></div>'+
  '<div class="facts"><div class="fact"><div class="k">Who</div><div class="v">'+esc(a.who)+'</div></div><div class="fact"><div class="k">When</div><div class="v">'+esc(a.when)+'</div></div><div class="fact"><div class="k">Time</div><div class="v">'+esc(a.time)+'</div></div><div class="fact"><div class="k">Tools</div><div class="v">'+esc(a.tools)+'</div></div></div>'+

V.raci = function(){
  var r=0,a=0,t=0; RACI.forEach(function(g){g.rows.forEach(function(x){if(x[1]==='C')return; t++; if(x[1]==='F')r++; if(x[2]==='F')a++;});});
  var groups = RACI.map(function(g){
    var link = g.href ? '<a class="btn live" href="'+g.href+'">Open '+esc(g.where)+' →</a>' : '<span class="btn off">'+esc(g.where)+' · not mapped yet</span>';

  '<div class="meta" style="align-items:center"><span>'+chip('F')+' Founder: creation and approval</span><span>'+chip('K')+' Operations and coordination</span><span>'+chip('C')+' Production coordinator, from Q1 2027</span><span style="color:var(--muted)">Today Cath does '+r+' of '+t+' tasks herself and approves '+a+'.</span></div>'+groups;

/* ---------- tree ---------- */
function tree(route){
  var h='<span class="lbl">Value streams</span>';
  function lk(label,href,depth,on){return '<a class="ti'+(on?' on':'')+'" style="padding-left:'+(10+depth*14)+'px" href="'+href+'"'+(on?' aria-current="page"':'')+'>'+esc(label)+'</a>';}
  function off(label,depth){return '<span class="ti" style="padding-left:'+(10+depth*14)+'px">'+esc(label)+'</span>';}
  h+=lk('Overview','#/',0,route.v==='home');
  L1.forEach(function(a){
    if(!a.live){h+=off(a.n+'  '+a.name,0);return;}
    h+=lk(a.n+'  '+a.name,a.href,0,route.v==='s2s');
    L2.forEach(function(p){
      if(!p.live){h+=off(p.code+'  '+p.name,1);return;}
      h+=lk(p.code+'  '+p.name,p.href,1,route.v==='order');
      h+=lk('3.1.6  Confirm the PO','#/confirm-po',2,route.v==='po');
      ACTS.forEach(function(x,i){h+=lk((i+1)+'. '+x.short,'#/step/'+(i+1),3,route.v==='step'&&route.i===i);});
    });
  });
  h+='<hr>'+lk('Who does what','#/raci',0,route.v==='raci');
  h+='<div class="legend"><span><i class="sw" style="background:var(--plum)"></i>Mapped: open it</span><span><i class="sw" style="background:var(--line)"></i>Listed, not mapped yet</span></div>';
  return h;
}
function crumbs(route){
  var c=[['Process Atlas','#/']];
  if(route.v==='raci') c.push(['Who does what']);
  if(['s2s','order','po','step'].indexOf(route.v)>-1) c.push(['3 Source to stock','#/source-to-stock']);
  if(['order','po','step'].indexOf(route.v)>-1) c.push(['3.1 Order','#/order']);
  if(['po','step'].indexOf(route.v)>-1) c.push(['3.1.6 Confirm the purchase order','#/confirm-po']);
  if(route.v==='step') c.push([ACTS[route.i].code+' '+ACTS[route.i].short]);
  return '<nav class="crumbs" aria-label="Breadcrumb">'+c.map(function(x,i){return i===c.length-1?'<span class="cur">'+esc(x[0])+'</span>':'<a href="'+x[1]+'">'+esc(x[0])+'</a><span class="sl" aria-hidden="true">/</span>';}).join('')+'</nav>';
}
var GOV = '<div class="gov"><span><b>Owner</b> Production coordinator</span><span><b>Approver</b> Cath</span><span><b>Kept current by</b> checking every logged exception against the step it broke</span><a class="nb pri" style="min-height:40px" href="mailto:?subject=Process%20Atlas%20change%20request&body=Process%20or%20step%3A%0AWhat%20should%20change%3A%0AWhy%3A">Suggest a change</a></div>';

/* ---------- router ---------- */
function parse(){
  var h=(location.hash||'#/').slice(1);
  if(h==='/source-to-stock') return {v:'s2s'};
  if(h==='/order') return {v:'order'};
  if(h==='/confirm-po') return {v:'po'};
  if(h==='/raci') return {v:'raci'};
  var m=h.match(/^\/step\/(\d)$/); if(m){var i=+m[1]-1; if(i>=0&&i<ACTS.length) return {v:'step',i:i};}
  return {v:'home'};
}
function render(){
  var r=parse(), body;
  if(r.v==='s2s') body=V.s2s(); else if(r.v==='order') body=V.order(); else if(r.v==='po') body=V.po(); else if(r.v==='step') body=V.step(r.i); else if(r.v==='raci') body=V.raci(); else body=V.home();
  var gov = (r.v==='po'||r.v==='step') ? GOV : '';
  document.getElementById('main').innerHTML = crumbs(r)+body+gov+'<p class="foot">Coco &amp; Cici Process Atlas · version 0.9 · October 2026 · internal</p>';
  document.getElementById('side').innerHTML = tree(r);
  document.getElementById('tab-map').classList.toggle('on', r.v!=='raci');
  document.getElementById('tab-raci').classList.toggle('on', r.v==='raci');
  var titles={home:'',s2s:'Source to stock · ',order:'Order · ',po:'Confirm the purchase order · ',raci:'Who does what · ',step:''};
  document.title=(r.v==='step'?ACTS[r.i].title+' · ':titles[r.v])+'Coco & Cici Process Atlas';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();

/* ---------- search ---------- */
var IDX=[];
L1.forEach(function(a){IDX.push({t:a.n+' '+a.name,s:a.desc,h:a.href||null});});
L2.forEach(function(p){IDX.push({t:p.code+' '+p.name,s:p.desc,h:p.href||null});});
L3.forEach(function(p){IDX.push({t:p.code+' '+p.name,s:'Process in 3.1 Order',h:p.href||'#/order'});});
ACTS.forEach(function(a,i){IDX.push({t:a.code+' '+a.title,s:a.steps.join(' '),h:'#/step/'+(i+1)});});
RACI.forEach(function(g){g.rows.forEach(function(x){IDX.push({t:x[0],s:'Task · '+g.phase,h:'#/raci'});});});
var q=document.getElementById('q'), res=document.getElementById('results');
q.addEventListener('input',function(){
  var v=q.value.trim().toLowerCase();
  if(v.length<2){res.classList.remove('show');res.innerHTML='';return;}
  var hits=IDX.filter(function(x){return (x.t+' '+x.s).toLowerCase().indexOf(v)>-1;}).slice(0,10);
  res.innerHTML = hits.length ? hits.map(function(x){return x.h?'<a href="'+x.h+'">'+esc(x.t)+'</a>':'<div class="none">'+esc(x.t)+' · not mapped yet</div>';}).join('') : '<div class="none">No match</div>';
  res.classList.add('show');
});
res.addEventListener('click',function(){res.classList.remove('show');q.value='';});
document.addEventListener('click',function(e){if(!e.target.closest('.search'))res.classList.remove('show');});
q.addEventListener('keydown',function(e){if(e.key==='Escape'){res.classList.remove('show');q.blur();}});
})();
</script>
